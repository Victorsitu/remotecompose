name: Deploy Web Editor to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'preview-src/**'
      - 'preview/**'
      - 'assets/**'
      - 'config*.json'
      - '*.rc'
      - 'editor-screenshot.png'
      - '.github/workflows/deploy-editor.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Build preview
        run: |
          cd preview-src
          chmod +x gradlew
          ./gradlew wasmJsBrowserDistribution

      - name: Prepare static site
        run: |
          mkdir -p _site/preview
          cp index.html _site/
          cp config*.json _site/
          cp *.rc _site/
          cp editor-screenshot.png _site/ || true
          cp -R assets _site/ || true
          cp -R preview-src/build/dist/wasmJs/productionExecutable/. _site/preview/
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
