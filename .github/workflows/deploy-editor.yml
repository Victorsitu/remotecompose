name: Deploy LiveEditor Web

on:
  push:
    branches:
      - main     # Asegúrate de que tu rama se llama main (o master)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Web Target
        # Ejecuta la compilación de Compose HTML/JS usando la estructura del proyecto
        run: gradle :liveeditor:wasmJsBrowserDistribution

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Esta es la ruta exacta donde Kotlin genera los archivos web
          path: './liveeditor/build/dist/js/productionExecutable/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
